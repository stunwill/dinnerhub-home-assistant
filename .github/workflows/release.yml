name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION="$(sed -n 's/^version: "\(.*\)"/\1/p' dinnerhub/config.yaml)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${VERSION}" != "${CONFIG_VERSION}" ]]; then
            echo "Tag ${VERSION} does not match config.yaml ${CONFIG_VERSION}" >&2
            exit 1
          fi
          echo "version=${CONFIG_VERSION}" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./dinnerhub
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.validate-version.outputs.version }}
          tags: ghcr.io/stunwill/${{ matrix.arch }}-dinnerhub:${{ needs.validate-version.outputs.version }}

  github-release:
    if: github.ref_type == 'tag'
    needs: [validate-version, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: dinnerhub/CHANGELOG.md
