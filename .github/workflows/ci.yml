name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate DevHub metadata and version consistency
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              Path("ROADMAP.md"),
              Path("CHANGELOG.md"),
              Path("dinnerhub/CHANGELOG.md"),
              Path("dinnerhub/config.yaml"),
              Path("dinnerhub/frontend/package.json"),
              Path("dinnerhub/app/main.py"),
              Path("dinnerhub/Dockerfile"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing DevHub metadata/version files: {', '.join(missing)}")

          roadmap = Path("ROADMAP.md").read_text(encoding="utf-8")
          if "# FoodHub Roadmap" not in roadmap or "Status:" not in roadmap:
              raise SystemExit("ROADMAP.md is not in the expected DevHub-friendly format")

          config = Path("dinnerhub/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*["\']?([^"\'\s]+)', config, re.MULTILINE)
          if not match:
              raise SystemExit("Unable to detect version from dinnerhub/config.yaml")
          version = match.group(1)

          package_version = json.loads(Path("dinnerhub/frontend/package.json").read_text(encoding="utf-8"))["version"]
          if package_version != version:
              raise SystemExit(f"Frontend version {package_version} does not match app version {version}")

          main_py = Path("dinnerhub/app/main.py").read_text(encoding="utf-8")
          if f'APP_VERSION = os.getenv("DINNERHUB_VERSION", "{version}")' not in main_py:
              raise SystemExit("Backend fallback APP_VERSION does not match app version")
          if '"version": APP_VERSION' not in main_py or '@app.get("/api/health")' not in main_py:
              raise SystemExit("/api/health does not expose APP_VERSION")

          dockerfile = Path("dinnerhub/Dockerfile").read_text(encoding="utf-8")
          if f"ARG BUILD_VERSION={version}" not in dockerfile:
              raise SystemExit("Dockerfile default BUILD_VERSION does not match app version")

          root_changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          ha_changelog = Path("dinnerhub/CHANGELOG.md").read_text(encoding="utf-8")
          if f"## {version}" not in root_changelog:
              raise SystemExit("Root CHANGELOG.md does not contain the current app version")
          if version not in ha_changelog:
              raise SystemExit("Home Assistant changelog does not reference the current app version")

          print(f"DevHub metadata valid for FoodHub {version}")
          PY

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinnerhub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dinnerhub/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest --cov=app --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile custom integration
        run: python -m compileall -q custom_components/dinnerhub
      - name: Validate JSON metadata
        run: python -m json.tool custom_components/dinnerhub/manifest.json >/dev/null && python -m json.tool custom_components/dinnerhub/strings.json >/dev/null && python -m json.tool custom_components/dinnerhub/translations/en.json >/dev/null && python -m json.tool hacs.json >/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinnerhub/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: node --check public/menu-planner-extension.js
      - run: node --check public/dashboard-meal-images.js
      - run: node --check public/dinnerhub-v060.js
      - run: node --check public/dinnerhub-v070.js
      - run: node --check public/dinnerhub-v080.js
      - run: node --check public/dinnerhub-v090.js
      - run: node --check public/dinnerhub-v010.js
      - run: node --check public/dinnerhub-v011.js
      - run: node --check public/dinnerhub-v012.js
      - run: node --check public/dinnerhub-v013.js
      - run: node --check public/foodhub-v014.js
      - run: node --check public/foodhub-v0141.js
      - name: Validate mobile responsive invariants
        run: |
          npm run build
          python -m http.server 4173 --directory dist >/tmp/foodhub-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          node public/foodhub-v0141-responsive-test.js
      - run: npm run build

  validate-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./dinnerhub
      - name: Build amd64 container
        run: |
          BUILD_VERSION=$(awk -F'"' '/^version:/ {print $2}' dinnerhub/config.yaml)
          docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION="$BUILD_VERSION" -t dinnerhub:test ./dinnerhub
