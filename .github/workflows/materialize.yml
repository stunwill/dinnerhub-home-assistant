name: Materialize DinnerHub foundation

on:
  push:
    branches:
      - agent/initial-dinnerhub-foundation
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-dinnerhub-foundation

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/dinnerhub-scaffold.b64
          base64 --decode /tmp/dinnerhub-scaffold.b64 > /tmp/dinnerhub-scaffold.tar.gz
          tar -xzf /tmp/dinnerhub-scaffold.tar.gz -C .
          rm -rf .bootstrap .github/workflows/materialize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish initial DinnerHub foundation"
          git push origin HEAD:agent/initial-dinnerhub-foundation
