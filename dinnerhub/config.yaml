name: DinnerHub
version: "0.4.2"
slug: dinnerhub
description: A self-hosted meal planner, recipe manager and shopping list app for Home Assistant.
url: https://github.com/stunwill/dinnerhub-home-assistant
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:silverware-fork-knife
panel_title: DinnerHub
map:
  - addon_config:rw
options:
  planning:
    default_days: 7
    repeat_warning_days: 14
  household:
    default_servings: 4
  features:
    shopping_list: true
    meal_suggestions: false
schema:
  planning:
    default_days: "list(7|14)"
    repeat_warning_days: "int(1,90)"
  household:
    default_servings: "int(1,30)"
  features:
    shopping_list: bool
    meal_suggestions: bool
